name: 🛡️ PrimeStore & PrimeForge 6-Engine Security Scanner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "APK indirme linki veya M3U URL'si"
        required: true
        type: string
      target_type:
        description: "Hedef Türü (apk veya m3u)"
        required: true
        default: "apk"
        type: choice
        options:
          - "apk"
          - "m3u"
      listing_id:
        description: "Supabase Listing ID (Opsiyonel)"
        required: false
        type: string
      sha256:
        description: "Dosya SHA-256 (Opsiyonel)"
        required: false
        type: string

  repository_dispatch:
    types: [security_scan]

jobs:
  scan:
    name: "⚡ 6-Engine Security Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install System & Security Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-daemon libmagic1
          sudo freshclam || true
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install apkid quark-engine || true

      - name: Resolve Inputs
        id: resolve
        run: |
          TARGET_URL="${{ github.event.client_payload.target_url || inputs.target_url }}"
          TARGET_TYPE="${{ github.event.client_payload.target_type || inputs.target_type || 'apk' }}"
          LISTING_ID="${{ github.event.client_payload.listing_id || inputs.listing_id || '' }}"
          SHA256="${{ github.event.client_payload.sha256 || inputs.sha256 || '' }}"

          echo "target_url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "target_type=$TARGET_TYPE" >> $GITHUB_OUTPUT
          echo "listing_id=$LISTING_ID" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Download Target
        run: |
          URL="${{ steps.resolve.outputs.target_url }}"
          TYPE="${{ steps.resolve.outputs.target_type }}"
          echo "Downloading $TYPE from: $URL"
          if [ "$TYPE" = "m3u" ]; then
            curl -sSL -A "PrimeStore/2.0" "$URL" -o input.m3u
            head -n 5 input.m3u
          else
            curl -sSL -A "Mozilla/5.0" "$URL" -o input.apk
            ls -lh input.apk
          fi

      - name: Run Security Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TYPE="${{ steps.resolve.outputs.target_type }}"
          LID="${{ steps.resolve.outputs.listing_id }}"
          mkdir -p output

          if [ "$TYPE" = "m3u" ]; then
            python engine/playlist_scanner.py input.m3u "$LID"
          else
            python engine/security_scanner.py input.apk
          fi

      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report-${{ github.run_id }}
          path: output/security_scan.json
          retention-days: 7
