name: "🔧 PrimeForge – APK Patch & Test Pipeline"

on:
  repository_dispatch:
    types: [patch-apk]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK indirme linki"
        required: true
      package_name:
        description: "Paket adı (opsiyonel, otomatik tespit edilir)"
        required: false
      profile:
        description: "Yama profili (opsiyonel, otomatik eşlenir)"
        required: false
      action:
        description: "Yapılacak işlem"
        type: choice
        default: "full_mod"
        options:
          - "full_mod"
          - "analyze_only"
          - "sanitize_only"

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Apktool
        id: cache-apktool
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/apktool.jar
          key: apktool-3.0.3

      - name: Install Python & System Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

          # Add Android SDK build-tools (zipalign, apksigner) to PATH directly
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "Using build-tools from: $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          else
            echo "Build tools not found in SDK, installing via apt..."
            sudo apt-get update && sudo apt-get install -y zipalign apksigner
          fi

          # Setup Apktool (use cached jar if present)
          if [ ! -f /usr/local/bin/apktool.jar ]; then
            echo "Downloading Apktool 3.0.3..."
            sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O /usr/local/bin/apktool.jar
          else
            echo "Apktool 3.0.3 restored from cache."
          fi
          sudo bash -c 'echo -e "#!/bin/bash\njava -jar /usr/local/bin/apktool.jar \"\$@\"" > /usr/local/bin/apktool'
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Decode Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > primestore_release.jks
          else
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore primestore_release.jks -alias primestore -keyalg RSA -keysize 2048 -validity 10000 -storepass primestore123 -keypass primestore123 -dname "CN=PrimeStore, OU=Release, O=Prime, L=TR, S=TR, C=TR"
          fi

      - name: Download Target APK
        run: |
          APK_URL="${{ github.event.client_payload.apk_url || inputs.apk_url }}"
          echo "Downloading APK from: $APK_URL"
          curl -L --retry 3 -o input.apk "$APK_URL"
          ls -lh input.apk

      - name: Run PrimeForge Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'primestore123' }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'primestore' }}
          ACTION: ${{ github.event.client_payload.action || inputs.action || 'full_mod' }}
          PROFILE: ${{ github.event.client_payload.profile || inputs.profile || '' }}
          JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python engine/forge_runner.py input.apk

      - name: Android Emulator Test & Multi-Device Screenshot Capture
        if: env.SKIP_EMULATOR != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            TARGET_APK="output/modded.apk"
            if [ ! -f "$TARGET_APK" ]; then
              TARGET_APK="input.apk"
            fi
            if [ -f "$TARGET_APK" ]; then
              echo "🚀 Running PrimeForge Multi-Device (TV, Mobile, Tablet) Emulator Test Suite on $TARGET_APK..."
              python engine/emulator_tester.py "$TARGET_APK" || true
              python engine/screenshot_uploader.py "${{ github.event.client_payload.job_id || github.run_id }}" "${{ github.event.client_payload.package_name || inputs.package_name || '' }}" || true
              if [ -f output/test_report.json ]; then
                CRASHED=$(python -c "import json; print(json.load(open('output/test_report.json')).get('status') == 'CRASHED')")
                if [ "$CRASHED" = "True" ]; then
                  echo "❌ UYGULAMA ÇÖKTÜ!"
                  PACKAGE=$(python -c "import json; print(json.load(open('output/test_report.json'))['package_name'])")
                  python telegram/bot.py crash "$PACKAGE" output/logcat_test.log || true
                  exit 1
                fi
              fi
            else
              echo "No target APK found to test."
            fi

      - name: Post-test Catbox Publish & Telegram Approval
        if: success() && (github.event.client_payload.action != 'analyze_only') && (inputs.action != 'analyze_only')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
        run: |
          python engine/publish.py

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-output-${{ github.run_id }}
          path: |
            output/
            docs/guides/
          retention-days: 7
